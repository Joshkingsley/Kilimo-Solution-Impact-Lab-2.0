[project]
name = "nitapata"
version = "0.0.1"
description = "Citation-locked fertiliser subsidy assistant — ingestion CLI and eval harness"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "pypdf>=5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
sms = ["fastapi>=0.115", "uvicorn>=0.30", "africastalking>=1.2", "python-multipart>=0.0.9"]

[project.scripts]
nitapata = "ingest.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The pipeline deliberately catches every SDK/network error at the LLM boundary and falls back to the
# templated path (SPEC §9.2 step 6: "API error -> fallback"). Broad catches there are the design.
"nitapata/*.py" = ["BLE001"]
# Teammate utilities kept as contributed; lint debt tracked, not rewritten here.
"app/sendsms.py" = ["BLE001", "LOG015"]
"app/scheme_doc_scraper.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
